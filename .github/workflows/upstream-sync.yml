name: Sync Zirconium Upstream

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: highwaytoit/zirconium-hci
          ref: main
          fetch-depth: 0

      - name: Sync Zirconium upstream and submodules in one pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: highwaytoit/zirconium-hci
          SYNC_BASE_BRANCH: main
          SYNC_DRY_RUN: '0'
        shell: bash
        run: bash build-scripts/hci-sync-upstream.sh